[project]
name = "seewo-robot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "numpy==2.2.6",
    "pillow==12.3.0",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "sortedcontainers==2.4.0",
    "textual==8.2.8",
]

[project.optional-dependencies]
dev = [
    "pip-tools==7.6.1",
    "ruff==0.15.16",
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
include = ["seewo_robot*"]
exclude = ["tmp", "logs"]
